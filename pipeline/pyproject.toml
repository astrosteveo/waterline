[project]
name = "kiln"
version = "0.1.0"
description = "Builds game assets from Python recipes in headless Blender."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kiln = "kiln.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiln"]

[tool.pytest.ini_options]
testpaths = ["tests"]
